---
- name: Download the K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/share/k3s-install.sh
    mode: "0755"

- name: Install K3s server
  ansible.builtin.command:
    cmd: >-
      /usr/local/share/k3s-install.sh server
      --flannel-backend=none
      --disable-network-policy
      --disable-kube-proxy
      --disable=traefik
      --disable=servicelb
      --write-kubeconfig-mode 600
      --tls-san {{ ansible_host }}
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    creates: /usr/local/bin/k3s

- name: Wait for the node token to be generated
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token

- name: Read the node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token_encoded
  no_log: true

- name: Store the token as a host variable for the agents
  ansible.builtin.set_fact:
    k3s_token: "{{ node_token_encoded['content'] | b64decode | trim }}"
  no_log: true

- name: Fetch kubeconfig to the workstation
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ repo_root }}/{{ kubeconfig_env }}_kubeconfig.yaml"
    flat: true

- name: Point the local kubeconfig at the server address
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: "{{ repo_root }}/{{ kubeconfig_env }}_kubeconfig.yaml"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host }}:6443"

- name: Restrict local kubeconfig permissions
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: "{{ repo_root }}/{{ kubeconfig_env }}_kubeconfig.yaml"
    mode: "0600"

- name: Install Helm
  ansible.builtin.dnf:
    name: helm
    state: present

- name: Add the Cilium Helm repository
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Install Cilium CNI
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_version: "{{ cilium_chart_version }}"
    release_namespace: kube-system
    create_namespace: false
    wait: true
    values:
      k8sServiceHost: "{{ ansible_default_ipv4.address }}"
      k8sServicePort: 6443
      # Cilium >= 1.14 takes a boolean here; "strict" is no longer valid.
      kubeProxyReplacement: true
      operator:
        replicas: 1
      ipam:
        mode: kubernetes
      ingressController:
        enabled: true
        loadbalancerMode: shared
        default: true
      l2announcements:
        enabled: true
      externalIPs:
        enabled: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
