extends: default

ignore: |
  clusters/*/flux-system/gotk-components.yaml
  provisioning/ansible/inventory/group_vars/all/secrets.yml
  resources/
  *.sops.yaml
  .git/

rules:
  line-length:
    max: 400
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: consistent
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  empty-lines:
    max: 2
